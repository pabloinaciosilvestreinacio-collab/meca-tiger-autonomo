name: FTC autonomous validation

on:
  push:
    branches:
      - main
      - revisao/autonomo-4.1-validacao
  workflow_dispatch:

jobs:
  logic:
    name: Tests de logica e simulacoes Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Executar testes
        run: |
          node tests/autonomo41_logic_tests.mjs
          node tests/autonomo50_synthetic_tests.mjs
          node tests/autonomo51_cell_tests.mjs
          node tests/autonomo51_pid_model.mjs

  compile-ftc:
    name: Compilar FTC SDK 12.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-30" "platforms;android-35" "build-tools;35.0.0"
      - name: Clonar projeto SDK FTC
        run: git clone --depth 1 https://github.com/FIRST-Tech-Challenge/FtcRobotController.git sdk
      - name: Inserir OpModes do candidato
        run: |
          mkdir -p sdk/TeamCode/src/main/java/org/firstinspires/ftc/teamcode/Autonomo
          cp TeamCode/src/main/java/org/firstinspires/ftc/teamcode/Autonomo/Autonomo51.java sdk/TeamCode/src/main/java/org/firstinspires/ftc/teamcode/Autonomo/
          cp TeamCode/src/main/java/org/firstinspires/ftc/teamcode/Autonomo/DiagnosticoAprilTag.java sdk/TeamCode/src/main/java/org/firstinspires/ftc/teamcode/Autonomo/
          cp TeamCode/src/main/java/org/firstinspires/ftc/teamcode/Autonomo/DiagnosticoSinais.java sdk/TeamCode/src/main/java/org/firstinspires/ftc/teamcode/Autonomo/
      - name: Compilar SDK FTC integrado
        working-directory: sdk
        run: |
          chmod +x gradlew
          ./gradlew :TeamCode:assembleDebug --no-daemon --stacktrace
