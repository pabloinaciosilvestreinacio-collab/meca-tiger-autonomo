name: Validar simulador FTC 2D
on:
  pull_request:
    paths: ['simulador/**', '.github/workflows/simulador-validation.yml']
  push:
    paths: ['simulador/**', '.github/workflows/simulador-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar física, servidor e execução Java real com camada simulada
        run: python -m unittest discover -s simulador/tests -v
      - name: Testar geometria e gamepad
        run: node --test simulador/tests/model.test.mjs
      - name: Conferir sintaxe da interface
        run: node --check simulador/web/app.js
      - name: Compilar nove OpModes existentes e executar cenários sintéticos
        run: python simulador/tests/repository_compatibility.py
      - name: Preservar integridade de fontes e históricos
        run: node tests/repositorio_integridade.mjs
