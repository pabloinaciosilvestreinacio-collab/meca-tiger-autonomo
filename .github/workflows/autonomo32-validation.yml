name: Autonomo 3.2 - logica e compilacao FTC

on:
  push:
    branches:
      - main
      - revisao/autonomo-3.2-sem-camera
    paths:
      - 'TeamCode/src/main/java/org/firstinspires/ftc/teamcode/Autonomo/Autonomo32.java'
      - 'tests/autonomo32_*'
      - '.github/workflows/autonomo32-validation.yml'
  workflow_dispatch:

jobs:
  testes-logicos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculos, PID e falhas
        run: |
          node tests/autonomo32_logic_tests.mjs
          node tests/autonomo32_travel_model.mjs

  compilacao-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Licencas e plataforma Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-30" "platforms;android-35" "build-tools;35.0.0"
      - name: Obter SDK FTC oficial
        run: git clone --depth 1 https://github.com/FIRST-Tech-Challenge/FtcRobotController.git ftc-sdk
      - name: Copiar somente Autonomo32.java
        run: |
          mkdir -p ftc-sdk/TeamCode/src/main/java/org/firstinspires/ftc/teamcode/Autonomo
          cp TeamCode/src/main/java/org/firstinspires/ftc/teamcode/Autonomo/Autonomo32.java ftc-sdk/TeamCode/src/main/java/org/firstinspires/ftc/teamcode/Autonomo/
      - name: Compilar TeamCode
        working-directory: ftc-sdk
        run: |
          chmod +x gradlew
          ./gradlew :TeamCode:assembleDebug --no-daemon --stacktrace
