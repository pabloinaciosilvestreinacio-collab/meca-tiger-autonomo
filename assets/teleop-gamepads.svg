<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-label="Desenho esquematico dos dois gamepads da Meca Tiger e legenda dos botoes do TeleOp 1.3">
<title>Meca Tiger TeleOp — mapeamento dos gamepads 1 e 2</title>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101318"/><stop offset="1" stop-color="#1D2229"/></linearGradient>
  <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#2B3039"/><stop offset="1" stop-color="#171B22"/></linearGradient>
  <style>
    .cap{font-family:Arial,Helvetica,sans-serif;font-size:14px;letter-spacing:2px;font-weight:bold;fill:#F6A36C}
    .title{font-family:Arial,Helvetica,sans-serif;font-size:35px;font-weight:900;fill:#F5F5F4}
    .sub{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#BEC5CF}
    .head{font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:800;fill:#FFF7F1}
    .id{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:bold;fill:#FF904E}
    .map{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#D8DDE5}
    .key{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:800;fill:#FF9B59}
    .small{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#A7B0BD}
    .button{fill:#101319;stroke:#566171;stroke-width:2}
    .orange{fill:#FF6B24}
  </style>
</defs>
<rect width="1440" height="930" rx="24" fill="url(#bg)"/>
<path d="M0 12 H1440" stroke="#FF6B24" stroke-width="12"/>
<text x="58" y="78" class="cap">M E C A  T I G E R  /  F T C  # 3 2 5 7 8</text>
<text x="58" y="126" class="title">TELEOPERADO 1.3 — MAPA DOS CONTROLES</text>
<text x="58" y="157" class="sub">Desenho esquemático · botões experimentais · confirmar sinais e montagem antes de usar no robô</text>

<!-- Driver panel -->
<rect x="50" y="200" width="660" height="655" rx="28" fill="#20262D" stroke="#373F4A" stroke-width="2"/>
<rect x="730" y="200" width="660" height="655" rx="28" fill="#20262D" stroke="#373F4A" stroke-width="2"/>
<rect x="70" y="221" width="620" height="5" rx="2" fill="#FF6B24"/>
<rect x="750" y="221" width="620" height="5" rx="2" fill="#FF6B24"/>
<text x="82" y="263" class="head">GAMEPAD 1</text>
<text x="82" y="288" class="small">PILOTO · tração MD / ME + assistência IMU</text>
<text x="762" y="263" class="head">GAMEPAD 2</text>
<text x="762" y="288" class="small">OPERADOR · intake MI + lançador MS</text>

<!-- Left controller body -->
<path d="M195 330 Q170 340 150 380 L126 477 Q118 515 149 526 Q181 534 211 494 L232 470 H531 L551 494 Q585 535 613 524 Q642 509 627 469 L602 380 Q590 336 545 330Z" fill="url(#panel)" stroke="#66707E" stroke-width="3"/>
<rect x="207" y="314" width="128" height="28" rx="10" fill="#1A1E25" stroke="#FF6B24" stroke-width="2"/>
<rect x="460" y="314" width="128" height="28" rx="10" fill="#1A1E25" stroke="#FF6B24" stroke-width="2"/>
<text x="252" y="333" class="id">LB</text><text x="508" y="333" class="id">RB</text>
<circle cx="260" cy="440" r="34" class="button"/><circle cx="260" cy="440" r="21" fill="#2F3945"/>
<circle cx="448" cy="440" r="34" class="button"/><circle cx="448" cy="440" r="21" fill="#2F3945"/>
<text x="221" y="490" class="small">LS • Y</text><text x="412" y="490" class="small">RS • X</text>
<rect x="335" y="367" width="33" height="15" rx="7" fill="#404B57"/>
<text x="326" y="360" class="id">BACK</text>
<rect x="391" y="367" width="33" height="15" rx="7" fill="#404B57"/>
<text x="388" y="360" class="id">START</text>
<path d="M170 402 h28 v-24 h20 v24 h28 v20 h-28 v27 h-20 v-27 h-28Z" fill="#384451" stroke="#6D7987"/>
<circle cx="561" cy="388" r="14" class="orange"/><text x="557" y="394" fill="#17191D" font-weight="bold" font-size="15">Y</text>
<circle cx="533" cy="415" r="14" class="button"/><text x="528" y="421" fill="#FFF" font-weight="bold" font-size="15">X</text>
<circle cx="590" cy="415" r="14" class="button"/><text x="585" y="421" fill="#FFF" font-weight="bold" font-size="15">B</text>
<circle cx="561" cy="443" r="14" class="button"/><text x="556" y="449" fill="#FFF" font-weight="bold" font-size="15">A</text>
<text x="81" y="574" class="key">LS Y</text><text x="184" y="574" class="map">Avançar / recuar</text>
<text x="81" y="607" class="key">RS X</text><text x="184" y="607" class="map">Girar (tração diferencial)</text>
<text x="81" y="640" class="key">LB / RB</text><text x="184" y="640" class="map">Precisão 35% / turbo 100%</text>
<text x="81" y="673" class="key">START</text><text x="184" y="673" class="map">Alterna curva quadrática</text>
<text x="81" y="706" class="key">BACK</text><text x="184" y="706" class="map">Segurar auxílio IMU ao avançar*</text>
<text x="81" y="739" class="key">D-PAD</text><text x="184" y="739" class="map">ESQ/DIR escolhe sinal yaw no INIT</text>
<text x="81" y="772" class="key">A</text><text x="184" y="772" class="map">Confirma sinal do IMU no INIT</text>
<text x="81" y="820" class="small">* Se IMU falhar ou sinal não for confirmado, direção manual.</text>

<!-- right controller -->
<path d="M875 330 Q850 340 830 380 L806 477 Q798 515 829 526 Q861 534 891 494 L912 470 H1211 L1231 494 Q1265 535 1293 524 Q1322 509 1307 469 L1282 380 Q1270 336 1225 330Z" fill="url(#panel)" stroke="#66707E" stroke-width="3"/>
<rect x="887" y="314" width="128" height="28" rx="10" fill="#1A1E25" stroke="#FF6B24" stroke-width="2"/>
<rect x="1140" y="314" width="128" height="28" rx="10" fill="#1A1E25" stroke="#FF6B24" stroke-width="2"/>
<text x="932" y="333" class="id">LB</text><text x="1188" y="333" class="id">RB</text>
<circle cx="940" cy="440" r="34" class="button"/><circle cx="940" cy="440" r="21" fill="#2F3945"/>
<circle cx="1128" cy="440" r="34" class="button"/><circle cx="1128" cy="440" r="21" fill="#2F3945"/>
<path d="M850 402 h28 v-24 h20 v24 h28 v20 h-28 v27 h-20 v-27 h-28Z" fill="#384451" stroke="#6D7987"/>
<circle cx="1241" cy="388" r="14" class="orange"/><text x="1236" y="394" fill="#17191D" font-weight="bold" font-size="15">Y</text>
<circle cx="1213" cy="415" r="14" class="orange"/><text x="1208" y="421" fill="#17191D" font-weight="bold" font-size="15">X</text>
<circle cx="1270" cy="415" r="14" class="button"/><text x="1265" y="421" fill="#FFF" font-weight="bold" font-size="15">B</text>
<circle cx="1241" cy="443" r="14" class="button"/><text x="1236" y="449" fill="#FFF" font-weight="bold" font-size="15">A</text>
<text x="761" y="574" class="key">Y / X</text><text x="874" y="574" class="map">Armar / bloquear MI e MS</text>
<text x="761" y="607" class="key">LB</text><text x="874" y="607" class="map">Intake MI (+60%) enquanto segura</text>
<text x="761" y="640" class="key">B</text><text x="874" y="640" class="map">Reverso MI (−35%) enquanto segura</text>
<text x="761" y="673" class="key">RB</text><text x="874" y="673" class="map">Lançador MS (+70%) enquanto segura</text>
<text x="761" y="706" class="key">A</text><text x="874" y="706" class="map">Alimenta MI após 0,8 s de MS</text>
<text x="761" y="739" class="key">Analógicos</text><text x="874" y="739" class="map">Sem função nesta versão</text>
<text x="761" y="772" class="key">STOP</text><text x="874" y="772" class="map">Pelo Driver Station, zera os motores</text>
<text x="761" y="820" class="small">Mecanismos começam bloqueados; confirme direção dos motores.</text>
<text x="55" y="894" class="small">Versão ilustrada: TeleOp 1.3 · não é o controle oficial da FTC · a legenda vale para o código versionado e não substitui calibração física.</text>
</svg>